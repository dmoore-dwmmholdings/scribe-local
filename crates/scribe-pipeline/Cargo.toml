[package]
name = "scribe-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["onnx"]
# Forwards the ML feature to the ASR/LLM crates.
onnx = ["scribe-asr/onnx", "scribe-llm/local-embed"]

[dependencies]
scribe-core = { workspace = true }
scribe-db = { workspace = true }
scribe-asr = { workspace = true, default-features = false }
scribe-llm = { workspace = true, default-features = false }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
