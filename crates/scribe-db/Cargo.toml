[package]
name = "scribe-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scribe-core = { workspace = true }
sqlx = { workspace = true }
# `halfvec` enables the `pgvector::HalfVector` type (the `chunks.embedding`
# column is `halfvec(768)`). Features are additive, so this augments the
# `["sqlx", "postgres"]` set declared on the workspace dependency.
pgvector = { workspace = true, features = ["halfvec"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
