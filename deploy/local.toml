# Scribe — single-machine config (storage + worker on ONE box).
#
# This runs both roles on the same computer, which is the simplest way to start.
# Later you can split into deploy/storage.toml + deploy/compute.toml across two
# machines (see docs/deployment.md).
#
# Env overrides still apply: SCRIBE_<SECTION>__<KEY>, e.g.
#   $env:SCRIBE_DATABASE__URL = "postgres://scribe:scribe@localhost:5433/scribe"

[database]
# Docker pgvector container (scripts/launch-local.ps1 starts it). Port 5433
# because a native Postgres already occupies 5432 on this machine.
url             = "postgres://scribe:scribe@localhost:5433/scribe?sslmode=disable"
max_connections = 10

[storage]
# Audio + transcoded WAV land here. Relative paths resolve to where you run
# `scribe` from (the repo root if you use the launch script).
blobs               = "./data/blobs"
signing_secret      = "change-me"
signed_url_ttl_secs = 600

[api]
# Plain HTTP on localhost. For phone access, put `tailscale serve` in front
# (Stage 3 in the launch guide) — do NOT expose this port to the internet.
bind             = "127.0.0.1:8443"
max_segment_bytes = 16777216
public_base_url  = "http://127.0.0.1:8443"

[auth]
# Start with auth off for local testing. Turn ON before exposing over Tailscale:
#   require_device_token = true   + a deploy/devices.toml with your phone's key.
require_device_token = false
# device_keys = "./deploy/devices.toml"

[asr]
model       = "whisper-large-v3-turbo"
diarization = true
# CUDA: LM Studio now leaves ~7.6 GB of the 16 GB free, which fits Whisper-large
# turbo. Drop back to "cpu" if a bigger LLM fills the card again and the encoder
# fails to load. Affects ASR + diarization + speaker embedding.
# NOTE: a clean `cargo build` re-copies the CPU-only onnxruntime.dll, so re-run
# scripts/setup-gpu.ps1 after one or this silently falls back to CPU.
device      = "cuda"
# Strip non-lexical fillers (uh, um, …) from transcripts. Override the list with
# filler_words = ["uh","um","like",...] — defaults cover common hesitation sounds.
remove_fillers = true

[worker]
stages         = ["all"]
concurrency    = 1
models_dir     = "./models"
heartbeat_secs = 15
poll_secs      = 5
max_attempts   = 5

[llm]
# Chat backend for summaries + RAG answers:
#   "openai"  → OpenAI-compatible server (LM Studio, llama.cpp, vLLM)
#   "ollama"  → Ollama's native API
provider        = "openai"

# LM Studio's local server. Start it in LM Studio → Developer tab → "Start Server"
# (default port 1234), and load a model. The trailing /v1 is added if you omit it.
base_url        = "http://127.0.0.1:1234/v1"
# api_key       = "lm-studio"   # LM Studio ignores this; set only if your server requires a key

# For LM Studio this is the LOADED model's identifier (see `GET /v1/models`, or the
# model name shown in LM Studio). 16 GB VRAM (4070 Ti SUPER) fits a 12–14B nicely.
# Replace with whatever you load, e.g.:
summarize_model = "google/gemma-4-e4b"

# Template that frames the automatic summary: general | standup | interview |
# one_on_one | lecture | sales. A recording can be re-summarized with a different
# template via POST /recordings/{id}/summarize. Unknown/empty → "general".
# summary_template = "general"

# Embeddings run in-process via fastembed (the real build) — NOT through LM Studio,
# so the index/query vectors always match. 768-dim = nomic-embed-text.
embed_model     = "nomic-embed-text"
embed_dim       = 768

# To use Ollama instead of LM Studio:
#   provider = "ollama"
#   base_url = "http://127.0.0.1:11434"
#   summarize_model = "gemma3:12b"

[update]
# Self-update endpoint — keep OFF until you've set a token + signing key.
enabled = false
