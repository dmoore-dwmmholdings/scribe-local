# Scribe — the whole system in one command.
#
#   docker compose up -d --build
#
# That builds the scribe image, starts Postgres, downloads the speech models,
# applies migrations, and runs the API and the worker. Nothing needs editing
# first: the signing secret and the phone's device token are generated into the
# data volume on first start (see docker/entrypoint.sh).
#
# Services
#   postgres      pgvector — the single rendezvous point for both roles
#   scribe-init   one-shot: migrate + download models, then exit
#   scribe-serve  the HTTP API the phone talks to
#   scribe-worker the transcription pipeline
#   ollama        optional LLM for summaries and Q&A (profile: ollama)
#
# Optional profiles
#   docker compose --profile ollama up -d      also run Ollama in a container
#
# Copy .env.example to .env to change ports, the public URL, or the LLM model.

name: scribe

# The scribe image is one binary in three roles, so the three services differ
# only in their command. This anchor holds everything they share.
x-scribe-common: &scribe-common
  build:
    context: .
    dockerfile: Dockerfile
  image: scribe:local
  env_file:
    - path: .env
      required: false
  environment:
    # The URL the phone and the worker use to reach the API. Set
    # SCRIBE_PUBLIC_BASE_URL in .env to your Tailscale MagicDNS name.
    SCRIBE_API__PUBLIC_BASE_URL: "${SCRIBE_PUBLIC_BASE_URL:-http://127.0.0.1:8443}"
    SCRIBE_LLM__SUMMARIZE_MODEL: "${SCRIBE_SUMMARIZE_MODEL:-gemma3:12b}"
    RUST_LOG: "${SCRIBE_LOG:-info}"
  volumes:
    - scribe-data:/data
    - scribe-models:/models
    - ./deploy/docker.toml:/etc/scribe/scribe.toml:ro
  restart: unless-stopped

services:

  # ---------------------------------------------------------------------------
  # Postgres with pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: scribe
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: the containers reach Postgres over the internal network,
      # and this publish exists just for psql and the native dev workflow.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe -d scribe"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # One-shot setup: schema + model assets
  # ---------------------------------------------------------------------------
  # Runs to completion before serve and worker start. `models pull` skips files
  # that already exist, so later starts are a no-op; the first one downloads
  # about 750 MB and exits non-zero if any of it fails, which stops the worker
  # from coming up and quietly "transcribing" stub text.
  scribe-init:
    <<: *scribe-common
    command: ["models", "pull"]
    # A YAML merge key gives the local mapping precedence wholesale, so this
    # block replaces the anchor's `environment` rather than adding to it. That
    # is fine here — setup needs the config file and the database, nothing else
    # — but anything this service must inherit has to be repeated.
    environment:
      # This service owns the schema, so serve and worker never race to apply
      # the same migration on a cold start.
      SCRIBE_MIGRATE_ON_START: "1"
      RUST_LOG: "${SCRIBE_LOG:-info}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Storage node: HTTP API, uploads, blobs, search, Q&A
  # ---------------------------------------------------------------------------
  scribe-serve:
    <<: *scribe-common
    command: ["--config", "/etc/scribe/scribe.toml", "serve"]
    depends_on:
      postgres:
        condition: service_healthy
      scribe-init:
        condition: service_completed_successfully
    ports:
      # Loopback only. `tailscale serve` fronts this with HTTPS on the tailnet;
      # publishing it on 0.0.0.0 would put every transcript on the LAN.
      - "127.0.0.1:${SCRIBE_API_PORT:-8443}:8443"
    healthcheck:
      # GET /health, not `scribe doctor` — doctor also fails when the optional
      # LLM is absent, which is a supported way to run the stack.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Processing node: the pipeline
  # ---------------------------------------------------------------------------
  # Shares the blob volume with scribe-serve — the pipeline reads segments
  # straight off disk rather than over HTTP.
  scribe-worker:
    <<: *scribe-common
    command: ["--config", "/etc/scribe/scribe.toml", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      scribe-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Ollama — summaries and Q&A (optional)
  # ---------------------------------------------------------------------------
  # docker compose --profile ollama up -d
  # then: docker compose exec ollama ollama pull gemma3:12b
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # NVIDIA GPU passthrough needs the container toolkit on the host (on Windows
    # that means Docker Desktop with a WSL2 backend and a current driver):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  scribe-data:
  scribe-models:
  ollama-models:
