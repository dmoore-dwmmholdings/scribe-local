# Scribe for iOS — native SwiftUI. Generate the Xcode project with:
#   cd ios && xcodegen
# The .xcodeproj is generated and not committed.
name: Scribe
options:
  bundleIdPrefix: com.dwmmholdings
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: P5GS55MLHL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Scribe:
    type: application
    platform: iOS
    sources:
      - path: Scribe
      - path: Shared
    dependencies:
      - target: ScribeLiveActivity
    info:
      path: Scribe/Info.plist
      properties:
        CFBundleDisplayName: Scribe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Scribe records meetings; microphone access is required.
        NSLocalNetworkUsageDescription: Scribe looks for your server on this network so you can connect without typing its address.
        NSBonjourServices: [_scribe._tcp]
        NSSupportsLiveActivities: true
        # Plain HTTP only to local addresses — a server on this Mac in the
        # simulator, or a .local name. Everything else stays HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.dwmmholdings.scribe.pair
            CFBundleURLSchemes: [scribe]
    settings:
      base:
        # A new bundle id while the React Native app is still on the phone, so
        # both can be installed side by side. Not com.dwmmholdings.scribe.* —
        # another team owns that wildcard.
        PRODUCT_BUNDLE_IDENTIFIER: com.dwmmholdings.scribenative
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  # Lock Screen and Dynamic Island while recording.
  ScribeLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ScribeLiveActivity
      - path: Shared
      - path: Scribe/Theme.swift
    info:
      path: ScribeLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Scribe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwmmholdings.scribenative.liveactivity
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # Drives the app in the simulator against a local server and saves
  # screenshots: ios/run-ui-tests.sh.
  ScribeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScribeUITests
    dependencies:
      - target: Scribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwmmholdings.scribenative.uitests
        TEST_TARGET_NAME: Scribe
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Scribe:
    build:
      targets:
        Scribe: all
        ScribeUITests: [test]
    test:
      targets:
        - ScribeUITests
