# Scribe for iOS — native SwiftUI. Generate the Xcode project with:
#   cd ios && xcodegen
# The .xcodeproj is generated and not committed.
name: Scribe
options:
  bundleIdPrefix: com.dwmmholdings
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: P5GS55MLHL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Scribe:
    type: application
    platform: iOS
    sources:
      - path: Scribe
    info:
      path: Scribe/Info.plist
      properties:
        CFBundleDisplayName: Scribe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Scribe records meetings; microphone access is required.
        NSLocalNetworkUsageDescription: Scribe looks for your server on this network so you can connect without typing its address.
        NSBonjourServices: [_scribe._tcp]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.dwmmholdings.scribe.pair
            CFBundleURLSchemes: [scribe]
    settings:
      base:
        # A new bundle id while the React Native app is still on the phone, so
        # both can be installed side by side. Not com.dwmmholdings.scribe.* —
        # another team owns that wildcard.
        PRODUCT_BUNDLE_IDENTIFIER: com.dwmmholdings.scribenative
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
